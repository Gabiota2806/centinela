services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: centinela_app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      DB_HOST: postgres
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres

  postgres:
    image: postgis/postgis:18-3.7
    container_name: centinela_postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: centinela
      POSTGRES_USER: centinela
      POSTGRES_PASSWORD: centinela_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-testing-db.sql:/docker-entrypoint-initdb.d/init-testing-db.sql:ro

volumes:
  postgres_data:
    driver: local
